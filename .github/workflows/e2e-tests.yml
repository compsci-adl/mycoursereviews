name: E2E Tests
on:
  workflow_call:
 
permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mycoursereviews
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mycoursereviews"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/mycoursereviews"
      KEYCLOAK_ISSUER: "https://auth.csclub.org.au/realms/csclub"
      KEYCLOAK_CLIENT_ID: "mycoursereviews"
      KEYCLOAK_CLIENT_SECRET: "secret"
      AUTH_SECRET: "secret-key-for-auth-32chars-minimum"
      NEXTAUTH_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm install -g pnpm@11 && pnpm install

      - name: Push Database Schema
        run: pnpm run db:push

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Playwright tests
        run: pnpm test:e2e
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
